<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Pendientes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .grid-kanban {
            display: grid;
            grid-template-columns: 80px repeat(3, minmax(250px, 1fr));
            grid-template-rows: 60px repeat(3, minmax(180px, auto));
            gap: 1px;
            background-color: #334155;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }
        .header-cell { background-color: #1e293b; color: #cbd5e1; font-weight: 700; text-align: center; padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; letter-spacing: 0.05em; font-size: 0.875rem;}
        .row-label { background-color: #1e293b; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; padding: 1rem; font-weight: 700; color: #cbd5e1; letter-spacing: 0.1em; font-size: 0.875rem;}
        .cell { background-color: #1e293b; padding: 1rem; min-height: 180px; position: relative; transition: background-color 0.2s;}
        .cell.drag-over { background-color: #334155; box-shadow: inset 0 0 0 2px #3b82f6; }
        
        .post-it { padding: 1rem; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 0.75rem; cursor: grab; position: relative; color: #0f172a; font-weight: 500; transition: transform 0.1s, box-shadow 0.1s; display: flex; flex-direction: column; gap: 0.5rem;}
        .post-it:active { cursor: grabbing; transform: scale(1.02) rotate(2deg); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4); z-index: 10;}
        .post-it h4 { margin: 0; font-size: 0.95rem; font-weight: 700; leading: 1.2;}
        .post-it p { margin: 0; font-size: 0.75rem; opacity: 0.8; line-height: 1.3;}
        .post-it .footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; font-weight: 600; margin-top: auto; padding-top: 0.5rem; border-top: 1px solid rgba(0,0,0,0.1);}
        
        /* Colores de Post-its según prioridad */
        .color-urgente { background: linear-gradient(135deg, #fecaca, #f87171); border-left: 4px solid #dc2626;}
        .color-importante { background: linear-gradient(135deg, #fef08a, #facc15); border-left: 4px solid #ca8a04;}
        .color-normal { background: linear-gradient(135deg, #bfdbfe, #60a5fa); border-left: 4px solid #2563eb;}
        
        /* Ribbons filas */
        .ribbon-urgente { border-left: 4px solid #ef4444; }
        .ribbon-importante { border-left: 4px solid #eab308; }
        .ribbon-normal { border-left: 4px solid #3b82f6; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .toast { position: fixed; bottom: 20px; right: 20px; background-color: #1e293b; border-left: 4px solid #3b82f6; color: white; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; display: flex; flex-direction: column; gap: 4px;}
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-title { font-weight: 700; font-size: 0.9rem;}
        .toast-desc { font-size: 0.8rem; color: #cbd5e1;}
    </style>
</head>
<body class="h-screen flex flex-col antialiased">

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg"><i class="ph ph-kanban text-white text-xl"></i></div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Centro de Pendientes</h1>
                <p class="text-xs text-slate-400">Sincronizado con Google Sheets</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="syncStatus" class="text-sm flex items-center gap-2 px-3 py-1 bg-slate-800 rounded-full text-green-400 border border-slate-700">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="hidden md:inline font-medium">Conectado</span>
            </div>
            <button onclick="fetchFromSheet()" class="p-2 rounded-full text-slate-400 hover:text-white hover:bg-slate-700 transition-colors" title="Forzar actualización">
                <i class="ph ph-arrows-clockwise text-xl"></i>
            </button>
            <button onclick="requestReport()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition-all font-semibold transform hover:scale-105 active:scale-95" title="Enviar PDF a Diana">
                <i class="ph ph-file-pdf text-lg"></i>
                <span class="hidden sm:inline">Enviar Reporte PDF</span>
            </button>
            <button onclick="openTaskModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 transition-all font-semibold transform hover:scale-105 active:scale-95">
                <i class="ph ph-plus-circle text-lg"></i>
                <span class="hidden sm:inline">Nuevo Pendiente</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 overflow-auto relative bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:20px_20px]">
        <div class="max-w-[1400px] mx-auto min-w-[900px]">
            <div class="grid-kanban shadow-2xl">
                <!-- Encabezados -->
                <div class="bg-slate-900"></div> <!-- Esquina -->
                <div class="header-cell"><i class="ph ph-push-pin"></i> POR HACER</div>
                <div class="header-cell"><i class="ph ph-spinner-gap"></i> EN CURSO</div>
                <div class="header-cell"><i class="ph ph-check-circle"></i> HECHO</div>

                <!-- Fila Urgente -->
                <div class="row-label ribbon-urgente">URGENTE</div>
                <div class="cell" id="Por Hacer-Urgente" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                <div class="cell" id="En Curso-Urgente" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                <div class="cell" id="Hecho-Urgente" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>

                <!-- Fila Importante -->
                <div class="row-label ribbon-importante">IMPORTANTE</div>
                <div class="cell" id="Por Hacer-Importante" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                <div class="cell" id="En Curso-Importante" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                <div class="cell" id="Hecho-Importante" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>

                <!-- Fila Normal -->
                <div class="row-label ribbon-normal">NORMAL</div>
                <div class="cell" id="Por Hacer-Normal" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                <div class="cell" id="En Curso-Normal" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                <div class="cell" id="Hecho-Normal" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
            </div>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 opacity-0 transition-all duration-200" id="modalContent">
            <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h3 class="text-lg font-bold text-white flex items-center gap-2" id="modalTitle">
                    <i class="ph ph-note-pencil text-blue-500"></i> <span id="modalTitleText">Nuevo Pendiente</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors p-1"><i class="ph ph-x text-xl"></i></button>
            </div>
            
            <form id="taskForm" onsubmit="saveTaskForm(event)" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Título del Pendiente</label>
                    <input type="text" id="taskTitle" required class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Descripción / Notas</label>
                    <textarea id="taskDesc" rows="2" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Responsable</label>
                        <input type="text" id="taskAssignee" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Prioridad</label>
                        <select id="taskPriority" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Normal">Normal</option>
                            <option value="Importante">Importante</option>
                            <option value="Urgente">Urgente</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Estado</label>
                        <select id="taskStatus" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Por Hacer">Por Hacer</option>
                            <option value="En Curso">En Curso</option>
                            <option value="Hecho">Hecho</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Fecha Límite</label>
                        <input type="date" id="taskDueDate" required class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none [color-scheme:dark]">
                    </div>
                </div>

                <div class="flex justify-between items-center mt-6 pt-4 border-t border-slate-700">
                    <button type="button" onclick="deleteTask()" id="btnDelete" class="text-red-400 hover:text-red-300 text-sm font-medium hidden">
                        <i class="ph ph-trash align-middle"></i> Eliminar
                    </button>
                    <div class="flex gap-3 ml-auto">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-300 hover:bg-slate-700 rounded-lg transition-colors">Cancelar</button>
                        <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-lg shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
                            <i class="ph ph-floppy-disk"></i> Guardar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Contenedor Toast -->
    <div id="toast" class="toast">
        <span id="toastTitle" class="toast-title"></span>
        <span id="toastDesc" class="toast-desc"></span>
    </div>

    <script>
        // 🚀 URL TUYA DE APPS SCRIPT
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw48493FmRwGeB2vlLfL0xKhWgJgFe2G1Nncbhid7e9HAw9m_yGYNzkSWMnXuhf_K6W/exec';
        
        let tasks = [];
        let currentDragId = null;

        // Mostrar notificaciones en pantalla
        function showMessage(title, desc, type="info", duration=3000) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastDesc').textContent = desc;
            
            if(type === 'error') toast.style.borderLeftColor = '#ef4444';
            else if(type === 'success') toast.style.borderLeftColor = '#10b981';
            else toast.style.borderLeftColor = '#3b82f6';

            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function showSyncIcon(syncing) {
            const el = document.getElementById('syncStatus');
            if(syncing) {
                el.innerHTML = '<div class="w-3 h-3 border-2 border-t-blue-500 border-blue-200 rounded-full animate-spin"></div><span class="hidden md:inline font-medium text-blue-400">Guardando...</span>';
                el.classList.replace('text-green-400', 'text-blue-400');
            } else {
                el.innerHTML = '<div class="w-2 h-2 rounded-full bg-green-500"></div><span class="hidden md:inline font-medium">Conectado</span>';
                el.classList.replace('text-blue-400', 'text-green-400');
            }
        }

        // Traer datos de Sheets al abrir
        async function fetchFromSheet() {
            showSyncIcon(true);
            try {
                const res = await fetch(APPS_SCRIPT_URL);
                const data = await res.json();
                if (data.status === 'success') {
                    tasks = data.tasks || [];
                    renderTasks();
                } else {
                    showMessage("Error", "No se pudieron cargar las tareas.", "error");
                }
            } catch(e) {
                console.error(e);
                showMessage("Sin conexión", "Revisa tu internet.", "error");
            }
            showSyncIcon(false);
        }

        // Guardar, mover o borrar en Sheets
        async function syncToSheet(action, taskData) {
            showSyncIcon(true);
            try {
                const payload = { action: action, task: taskData };
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload) // Usamos plain text fetch per Google constraints a veces, JSON works normally with CORS setup
                });
            } catch(e) {
                console.error(e);
                showMessage("Aviso de red", "Cambio local hecho, pero falló conexión a nube.", "error");
            }
            showSyncIcon(false);
        }

        // Generar y enviar el PDF
        window.requestReport = async () => {
            showSyncIcon(true);
            showMessage("Generando PDF...", "Enviando el reporte a Diana. Esto tomará unos segundos.", "info", 5000);
            
            try {
                const payload = { action: 'send_report' };
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.status === 'success') {
                    showMessage("¡PDF Enviado! 📄", "El reporte ya está en el correo de Diana.", "success", 4000);
                } else {
                    showMessage("Error", "No se pudo enviar.", "error");
                }
            } catch (error) {
                showMessage("Error", "Falló la comunicación.", "error");
            }
            showSyncIcon(false);
        };

        function renderTasks() {
            // Limpiar todas las celdas
            document.querySelectorAll('.cell').forEach(cell => cell.innerHTML = '');
            
            const hoy = new Date().toISOString().split('T')[0];

            tasks.forEach(task => {
                const cellId = `${task.status}-${task.priority}`;
                const cell = document.getElementById(cellId);
                
                if (cell) {
                    const el = document.createElement('div');
                    el.className = `post-it color-${task.priority.toLowerCase()}`;
                    el.draggable = true;
                    el.id = task.id;
                    el.ondragstart = drag;
                    el.onclick = () => openTaskModal(task.id);

                    // Alerta visual de vencimiento inminente (2 días)
                    let alertDot = '';
                    if (task.dueDate && task.status !== 'Hecho') {
                        const msDiff = new Date(task.dueDate) - new Date();
                        const daysDiff = msDiff / (1000 * 60 * 60 * 24);
                        if (daysDiff <= 2) {
                            alertDot = '<span class="absolute -top-1 -right-1 flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500 border border-white"></span></span>';
                        }
                    }

                    el.innerHTML = `
                        ${alertDot}
                        <h4>${task.title}</h4>
                        ${task.desc ? `<p class="truncate">${task.desc}</p>` : ''}
                        <div class="footer">
                            <span class="flex items-center gap-1"><i class="ph ph-user"></i> ${task.assignee || 'N/A'}</span>
                            <span class="flex items-center gap-1"><i class="ph ph-calendar"></i> ${task.dueDate || 'Sin fecha'}</span>
                        </div>
                    `;
                    cell.appendChild(el);
                }
            });
        }

        // --- Drag and Drop Logic ---
        function drag(ev) {
            currentDragId = ev.target.id;
            ev.dataTransfer.setData("text", ev.target.id);
            setTimeout(() => ev.target.style.opacity = "0.5", 0);
        }

        function allowDrop(ev) {
            ev.preventDefault();
            const cell = ev.target.closest('.cell');
            if(cell) cell.classList.add('drag-over');
        }

        function dragLeave(ev) {
            const cell = ev.target.closest('.cell');
            if(cell) cell.classList.remove('drag-over');
        }

        function drop(ev) {
            ev.preventDefault();
            const cell = ev.target.closest('.cell');
            if(cell) cell.classList.remove('drag-over');
            
            const draggedEl = document.getElementById(currentDragId);
            if (draggedEl) draggedEl.style.opacity = "1";

            if (cell && currentDragId) {
                const [newStatus, newPriority] = cell.id.split('-');
                
                // Actualizar localmente
                const taskIndex = tasks.findIndex(t => t.id === currentDragId);
                if (taskIndex > -1) {
                    tasks[taskIndex].status = newStatus;
                    tasks[taskIndex].priority = newPriority;
                    
                    renderTasks(); // Refrescar UI
                    syncToSheet('save', tasks[taskIndex]); // Enviar cambio
                }
            }
            currentDragId = null;
        }

        // --- Funciones del Modal ---
        window.openTaskModal = (id = null) => {
            const modal = document.getElementById('taskModal');
            const content = document.getElementById('modalContent');
            const form = document.getElementById('taskForm');
            
            form.reset();
            document.getElementById('taskStartDate').value = new Date().toISOString().split('T')[0];

            if (id) {
                const task = tasks.find(t => t.id === id);
                document.getElementById('modalTitleText').textContent = 'Editar Pendiente';
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDesc').value = task.desc;
                document.getElementById('taskAssignee').value = task.assignee;
                document.getElementById('taskPriority').value = task.priority;
                document.getElementById('taskStatus').value = task.status;
                document.getElementById('taskDueDate').value = task.dueDate || '';
                document.getElementById('btnDelete').classList.remove('hidden');
            } else {
                document.getElementById('modalTitleText').textContent = 'Nuevo Pendiente';
                document.getElementById('taskId').value = 'T-' + Date.now();
                document.getElementById('taskStatus').value = 'Por Hacer';
                document.getElementById('taskPriority').value = 'Normal';
                document.getElementById('btnDelete').classList.add('hidden');
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // Animación de entrada
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        window.closeModal = () => {
            const modal = document.getElementById('taskModal');
            const content = document.getElementById('modalContent');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200); // Igual a la duración de la transición CSS
        };

        window.saveTaskForm = (e) => {
            e.preventDefault();
            
            const task = {
                id: document.getElementById('taskId').value,
                title: document.getElementById('taskTitle').value,
                desc: document.getElementById('taskDesc').value,
                assignee: document.getElementById('taskAssignee').value,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                startDate: document.getElementById('taskStartDate') ? document.getElementById('taskStartDate').value : new Date().toISOString().split('T')[0],
                dueDate: document.getElementById('taskDueDate').value
            };

            const index = tasks.findIndex(t => t.id === task.id);
            if (index > -1) {
                tasks[index] = task;
                showMessage("Actualizado", "Cambios guardados localmente.", "info");
            } else {
                tasks.push(task);
                showMessage("Creado", "Nuevo pendiente registrado.", "success");
            }

            renderTasks();
            closeModal();
            syncToSheet('save', task);
        };

        window.deleteTask = () => {
            const id = document.getElementById('taskId').value;
            const task = tasks.find(t => t.id === id);
            
            // Eliminar localmente
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
            closeModal();
            showMessage("Eliminado", "La tarea ha sido removida.", "info");
            
            // Mandar a borrar
            if(task) syncToSheet('delete', task);
        };

        // Agregar campo oculto de fecha inicio para usar en save
        document.getElementById('taskForm').insertAdjacentHTML('beforeend', '<input type="hidden" id="taskStartDate">');

        // Inicializar
        document.addEventListener('DOMContentLoaded', fetchFromSheet);
    </script>
</body>
</html>
